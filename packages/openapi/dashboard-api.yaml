openapi: 3.1.0
info:
  title: HashHive Dashboard API
  description: |
    REST API consumed by the HashHive React dashboard. Authenticated by
    BetterAuth cookie sessions, paginated with `page`/`pageSize` (or
    `limit`/`offset` on some surfaces), and returns errors in the
    envelope `{ error: { code, message } }`.

    This document covers the **Campaign Orchestration** surface
    completed in PR #151. The full dashboard surface (auth, projects,
    agents, resources, results, stats, health) is currently
    documented in-code; a future revision of this spec will expand
    coverage. New endpoints should be added here as they ship.

    ## Conventions

    - All authenticated requests carry the BetterAuth session cookie
      (`hh.session_token=...`).
    - The user's active project is conveyed via the `x-project-id`
      header and enforced server-side via `requireProjectAccess`.
    - All errors share the envelope `{ error: { code: string,
      message: string } }`.
    - Status codes:
      - **200** — request succeeded
      - **201** — resource created
      - **400** — request was malformed or input invalid
      - **403** — caller lacks the required role
      - **404** — resource not found or not visible in the current project
      - **409** — request well-formed but state precondition failed
        (NOT_DRAFT, RESOURCE_MISSING, STALE_STATE)
      - **500** — server error (TASK_GENERATION_FAILED, unexpected)
      - **503** — dependent service unavailable (queue, resource lookup)

  version: 1.0.0

servers:
  - url: /api/v1/dashboard
    description: Dashboard API base path

tags:
  - name: Campaigns
    description: Campaign orchestration — create, edit, list, lifecycle, attacks.
  - name: Resources
    description: |
      Hash lists, wordlists, rulelists, masklists. Hash lists carry the
      target hashes a campaign tries to crack; wordlists/rulelists/masklists
      are the inputs an attack consumes. Upload paths: small files
      (≤ 10 MB) use direct multipart; larger files go through the chunked
      S3 multipart endpoints under `/resources/upload/*`.

paths:
  /campaigns:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
    post:
      operationId: createCampaign
      summary: Create a new campaign (optionally with inline attacks)
      description: |
        Creates a campaign in `draft` status. When the optional
        `attacks[]` array is supplied, the campaign and all attacks are
        inserted in a single database transaction with pre-commit DAG
        validation and cross-project resource validation. Attack
        `dependencyIndices` reference attacks by their 0-based position
        in the same request (since attacks have no DB id until insert);
        the server translates these to real attack IDs after insert.
      tags: [Campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                type: object
                required: [campaign, attacks]
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
                  attacks:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttackSummary'
                    description: |
                      Always present. Empty when the request omitted
                      `attacks[]`; otherwise contains the inserted
                      attacks with real IDs and translated dependencies.
        '400':
          description: Body failed validation, or proposed inline-attack DAG contains a cycle / dangling dependency.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/DagInvalidError'
        '409':
          description: Cross-project resource reference rejected by the draft-write resource validator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMissingError'

  /campaigns/{id}:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateCampaignPartial
      summary: Partial-update a draft campaign
      description: |
        Updates only the fields supplied in the request body. Only
        permitted while the campaign is in `draft` status; transitions
        to `running` lock the editable surface.
      tags: [Campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCampaignRequest'
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/NotDraft'
    put:
      operationId: updateCampaignReplace
      summary: Full-replace a draft campaign
      description: |
        Replaces the campaign with the supplied body. `name` and
        `priority` are required. `description` may be `null` to
        explicitly clear a previous description; omitting the field
        with PATCH would leave it untouched.
      tags: [Campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCampaignRequest'
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/NotDraft'
    delete:
      operationId: deleteCampaign
      summary: Delete a draft campaign
      tags: [Campaigns]
      responses:
        '200':
          description: Campaign deleted
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/NotDraft'

  /campaigns/{id}/start:
    post:
      operationId: startCampaign
      summary: Transition a campaign to `running`
      description: |
        Validates that the campaign has at least one attack, that every
        referenced resource exists in the current project, and that
        the task queue is available. On success, generates tasks
        (inline if small, queued if large) and emits the
        `campaign_status` event.
      tags: [Campaigns]
      parameters:
        - $ref: '#/components/parameters/XProjectIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/InvalidTransition'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Resource missing or stale state.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResourceMissingError'
                  - $ref: '#/components/schemas/StaleStateError'
        '500':
          $ref: '#/components/responses/TaskGenerationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /campaigns/{id}/pause:
    post:
      operationId: pauseCampaign
      summary: Transition a running campaign to `paused`
      tags: [Campaigns]
      parameters:
        - $ref: '#/components/parameters/XProjectIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/InvalidTransition'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Stale state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleStateError'

  /campaigns/{id}/resume:
    post:
      operationId: resumeCampaign
      summary: Transition a paused campaign back to `running`
      tags: [Campaigns]
      parameters:
        - $ref: '#/components/parameters/XProjectIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/InvalidTransition'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Resource missing or stale state.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResourceMissingError'
                  - $ref: '#/components/schemas/StaleStateError'

  /campaigns/{id}/stop:
    post:
      operationId: stopCampaign
      summary: Stop a campaign and reset it to `draft`
      description: |
        Cancels all in-flight tasks and resets the campaign's
        `startedAt`, `completedAt`, and `progress` fields. The
        campaign remains restartable.
      tags: [Campaigns]
      parameters:
        - $ref: '#/components/parameters/XProjectIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/InvalidTransition'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Stale state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleStateError'

  /campaigns/{id}/cancel:
    post:
      operationId: cancelCampaign
      summary: Transition a campaign to `cancelled` (terminal)
      tags: [Campaigns]
      parameters:
        - $ref: '#/components/parameters/XProjectIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/InvalidTransition'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /campaigns/{id}/lifecycle:
    post:
      operationId: lifecycleAction
      summary: Run a lifecycle action via action-enum body
      description: |
        Equivalent surface to the spec-named alias routes
        (`/start`, `/pause`, `/resume`, `/stop`, `/cancel`).
        Preserved for clients that prefer the enum-style request.
      tags: [Campaigns]
      parameters:
        - $ref: '#/components/parameters/XProjectIdHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, pause, resume, stop, cancel]
      responses:
        '200':
          $ref: '#/components/responses/CampaignWrapper'
        '400':
          $ref: '#/components/responses/InvalidTransition'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Resource missing or stale state.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResourceMissingError'
                  - $ref: '#/components/schemas/StaleStateError'

  /campaigns/{id}/attacks:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: addAttack
      summary: Add an attack to a campaign
      description: |
        Pre-validates the proposed DAG (current attacks + the new one
        with a synthetic id) and the referenced resources before
        persisting. `dependencies` here references **real attack IDs**
        — not indices like the inline-create path.
      tags: [Campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttackRequest'
      responses:
        '201':
          description: Attack created
          content:
            application/json:
              schema:
                type: object
                required: [attack]
                properties:
                  attack: { $ref: '#/components/schemas/AttackSummary' }
        '400':
          description: Validation error or DAG cycle.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/DagInvalidError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: Cross-project resource reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMissingError'

  # ─── Resources ─────────────────────────────────────────────────────
  /resources/hash-types:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
    get:
      operationId: listHashTypes
      summary: List supported hash types
      tags: [Resources]
      responses:
        '200':
          description: All hash types known to the platform (ordered by hashcat mode).
          content:
            application/json:
              schema:
                type: object
                required: [hashTypes]
                properties:
                  hashTypes:
                    type: array
                    items: { $ref: '#/components/schemas/HashType' }

  /resources/hash-lists:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
    get:
      operationId: listHashLists
      summary: List hash lists for the active project
      tags: [Resources]
      responses:
        '200':
          description: Project-scoped hash lists, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [hashLists]
                properties:
                  hashLists:
                    type: array
                    items: { $ref: '#/components/schemas/HashList' }
    post:
      operationId: createOrUploadHashList
      summary: Create a hash list, optionally with a one-shot multipart upload
      description: |
        Content-type-aware. `multipart/form-data` runs the full
        create + upload + enqueue flow and returns **202** with
        `status=processing` (large files >10 MB must use the chunked
        upload endpoints instead). `application/json` runs the legacy
        create-empty flow (caller follows up with `/upload` + `/import`)
        and returns **201**.
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHashListRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file: { type: string, format: binary }
                name: { type: string, minLength: 1, maxLength: 200 }
                hashTypeId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Hash list created (JSON path, no upload).
          content:
            application/json:
              schema:
                type: object
                required: [hashList]
                properties:
                  hashList: { $ref: '#/components/schemas/HashList' }
        '202':
          description: Hash list created and parsing enqueued (multipart path).
          content:
            application/json:
              schema:
                type: object
                required: [hashList]
                properties:
                  hashList: { $ref: '#/components/schemas/HashList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /resources/hash-lists/{id}:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getHashList
      summary: Get a hash list with live statistics
      tags: [Resources]
      responses:
        '200':
          description: Hash list with merged persisted + live statistics.
          content:
            application/json:
              schema:
                type: object
                required: [hashList]
                properties:
                  hashList:
                    allOf:
                      - $ref: '#/components/schemas/HashList'
                      - type: object
                        properties:
                          statistics: { $ref: '#/components/schemas/HashListStatistics' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    delete:
      operationId: deleteHashList
      summary: Delete a hash list and its hash items
      description: |
        Idempotent. Cascade-deletes `hash_items` for this hash list and
        attempts to remove the underlying S3 object (logged on failure
        but doesn't block). Returns **409** when a campaign or attack
        still references the row — operator must remove those first.
      tags: [Resources]
      responses:
        '204': { description: Hash list deleted. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409':
          description: Hash list is still referenced by a campaign or attack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceInUseError' }

  /resources/hash-lists/{id}/upload:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: uploadHashListFile
      summary: Upload the hash list file (direct, ≤ 10 MB)
      description: |
        Used after a JSON create-empty `POST /hash-lists`. Larger files
        must use the chunked endpoints at `/resources/upload/*`.
      tags: [Resources]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Upload accepted; hash list now has `status=uploaded`.
          content:
            application/json:
              schema:
                type: object
                required: [key, size]
                properties:
                  key: { type: string }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /resources/hash-lists/{id}/import:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: importHashList
      summary: Enqueue async parsing for an already-uploaded hash list
      tags: [Resources]
      responses:
        '200':
          description: Job enqueued; hash list now has `status=processing`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enqueued: { type: boolean }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /resources/hash-lists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: status, in: query, schema: { type: string, enum: [all, cracked, uncracked] } }
      - { name: q, in: query, schema: { type: string, maxLength: 256 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    get:
      operationId: listHashItems
      summary: Paginated, filterable hash items for a hash list
      tags: [Resources]
      responses:
        '200':
          description: Paginated hash items.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HashItem' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /resources/hash-lists/{id}/download:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getHashListDownloadUrl
      summary: Presigned download URL for the hash list file
      tags: [Resources]
      responses:
        '200':
          description: Time-limited presigned URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /resources/detect-hash-type:
    post:
      operationId: detectHashType
      summary: Identify likely hash types for sample hashes
      description: |
        Hand-rolled regex matcher (~25 patterns, popularity-ranked).
        Capped at 100 hashes per call to bound CPU on the synchronous
        path.
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectHashTypeRequest' }
      responses:
        '200':
          description: One result entry per input hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectHashTypeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  # The wordlists/rulelists/masklists endpoints share an identical shape
  # — list, create, get, upload (≤10 MB), download (presigned), delete.
  # Documented as parameterized paths under each prefix so generated
  # clients get one method per (resource, operation).
  /resources/wordlists:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
    get:
      operationId: listWordlists
      summary: List wordlists for the active project
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceList' }
    post:
      operationId: createWordlist
      summary: Create an empty wordlist record
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceRequest' }
      responses:
        '201': { $ref: '#/components/responses/ResourceCreated' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /resources/wordlists/{id}:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getWordlist
      summary: Get a wordlist
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceItem' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    delete:
      operationId: deleteWordlist
      summary: Delete a wordlist
      tags: [Resources]
      responses:
        '204': { description: Wordlist deleted. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409':
          description: Wordlist is still referenced by an attack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceInUseError' }

  /resources/wordlists/{id}/upload:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: uploadWordlistFile
      summary: Upload the wordlist file (direct, ≤ 10 MB)
      tags: [Resources]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ResourceUploadResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /resources/wordlists/{id}/download:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getWordlistDownloadUrl
      summary: Presigned download URL for the wordlist file
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceDownloadUrl' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  # /resources/rulelists/* and /resources/masklists/* mirror /resources/wordlists/*
  # exactly. The factory `createResourceRoutes` in
  # `packages/backend/src/routes/dashboard/resources.ts` wires them with
  # identical shapes; clients should treat the three as a uniform family.
  # See operationIds: list/create/get/upload/download/delete<Rulelist|Masklist>.
  /resources/rulelists:
    parameters: [{ $ref: '#/components/parameters/XProjectIdHeader' }]
    get:
      operationId: listRulelists
      tags: [Resources]
      responses: { '200': { $ref: '#/components/responses/ResourceList' } }
    post:
      operationId: createRulelist
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceRequest' }
      responses:
        '201': { $ref: '#/components/responses/ResourceCreated' }

  /resources/rulelists/{id}:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getRulelist
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceItem' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    delete:
      operationId: deleteRulelist
      tags: [Resources]
      responses:
        '204': { description: Rulelist deleted. }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceInUseError' }
          description: Rulelist is still referenced by an attack.

  /resources/rulelists/{id}/upload:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: uploadRulelistFile
      tags: [Resources]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ResourceUploadResult' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /resources/rulelists/{id}/download:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getRulelistDownloadUrl
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceDownloadUrl' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /resources/masklists:
    parameters: [{ $ref: '#/components/parameters/XProjectIdHeader' }]
    get:
      operationId: listMasklists
      tags: [Resources]
      responses: { '200': { $ref: '#/components/responses/ResourceList' } }
    post:
      operationId: createMasklist
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceRequest' }
      responses:
        '201': { $ref: '#/components/responses/ResourceCreated' }

  /resources/masklists/{id}:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getMasklist
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceItem' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    delete:
      operationId: deleteMasklist
      tags: [Resources]
      responses:
        '204': { description: Masklist deleted. }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceInUseError' }
          description: Masklist is still referenced by an attack.

  /resources/masklists/{id}/upload:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: uploadMasklistFile
      tags: [Resources]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ResourceUploadResult' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /resources/masklists/{id}/download:
    parameters:
      - $ref: '#/components/parameters/XProjectIdHeader'
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getMasklistDownloadUrl
      tags: [Resources]
      responses:
        '200': { $ref: '#/components/responses/ResourceDownloadUrl' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  # Chunked S3 multipart upload — used by the dashboard UI when a file
  # exceeds the 10 MB direct-upload cap. PUT carries raw binary part
  # bodies (no JSON validation). The (resourceId, resourceType) tuple
  # MUST accompany every per-upload-session call (PUT part, complete,
  # abort, status) so the server can re-validate project ownership on
  # every request.
  /resources/upload/initiate:
    parameters: [{ $ref: '#/components/parameters/XProjectIdHeader' }]
    post:
      operationId: initiateChunkedUpload
      summary: Begin a chunked S3 multipart upload
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, name, fileSize]
              properties:
                resourceType:
                  type: string
                  enum: [hash-lists, wordlists, rulelists, masklists]
                name: { type: string, minLength: 1, maxLength: 255 }
                fileSize: { type: integer, minimum: 1, maximum: 500000000000 }
                contentType: { type: string }
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, key, partSize]
                properties:
                  uploadId: { type: string }
                  key: { type: string }
                  partSize: { type: integer }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '500':
          description: Upload session could not be initialized.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        properties:
                          code: { type: string, enum: [UPLOAD_INIT_FAILED] }

  /resources/upload/{uploadId}/part/{partNumber}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
      - {
          name: partNumber,
          in: path,
          required: true,
          schema: { type: integer, minimum: 1, maximum: 10000 },
        }
      - { name: resourceId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      - {
          name: resourceType,
          in: query,
          required: true,
          schema: { type: string, enum: [hash-lists, wordlists, rulelists, masklists] },
        }
    put:
      operationId: uploadChunkPart
      summary: Upload one part of a chunked upload
      description: |
        Body is raw binary (no JSON). Returns the part's S3 `ETag`. The
        (resourceId, resourceType) query tuple is required so the server
        can re-validate project ownership on every part.
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Part accepted.
          content:
            application/json:
              schema:
                type: object
                required: [etag]
                properties:
                  etag: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '500':
          description: Part could not be uploaded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        properties:
                          code: { type: string, enum: [UPLOAD_PART_FAILED] }

  /resources/upload/{uploadId}/complete:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      operationId: completeChunkedUpload
      summary: Finalize a chunked upload (assembles all parts on the bucket)
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts, resourceId, resourceType]
              properties:
                parts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer, minimum: 1 }
                      etag: { type: string, minLength: 1 }
                resourceId: { type: integer, minimum: 1 }
                resourceType:
                  type: string
                  enum: [hash-lists, wordlists, rulelists, masklists]
      responses:
        '200':
          description: Upload assembled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '500':
          description: Upload could not be completed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        properties:
                          code: { type: string, enum: [UPLOAD_COMPLETE_FAILED] }

  /resources/upload/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
      - { name: resourceId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      - {
          name: resourceType,
          in: query,
          required: true,
          schema: { type: string, enum: [hash-lists, wordlists, rulelists, masklists] },
        }
    delete:
      operationId: abortChunkedUpload
      summary: Abort a chunked upload and release its parts
      tags: [Resources]
      responses:
        '200':
          description: Upload aborted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /resources/upload/{uploadId}/status:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
      - { name: resourceId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      - {
          name: resourceType,
          in: query,
          required: true,
          schema: { type: string, enum: [hash-lists, wordlists, rulelists, masklists] },
        }
    get:
      operationId: getChunkedUploadStatus
      summary: Get status of an in-flight chunked upload
      tags: [Resources]
      responses:
        '200':
          description: Upload status and completed parts.
          content:
            application/json:
              schema:
                type: object
                required: [status, completedParts]
                properties:
                  status: { type: string }
                  completedParts:
                    type: array
                    items:
                      type: object
                      required: [partNumber, etag, size]
                      properties:
                        partNumber: { type: integer }
                        etag: { type: string }
                        size: { type: integer }
        '400': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: hh.session_token

  parameters:
    XProjectIdHeader:
      name: x-project-id
      in: header
      required: true
      description: |
        The active project id for this request. Enforced server-side by
        `requireProjectAccess` middleware against the BetterAuth
        session. All campaign endpoints (and every project-scoped
        dashboard route) require this header.
      schema:
        type: integer
        minimum: 1

  schemas:
    Campaign:
      type: object
      required: [id, projectId, name, hashListId, status, priority]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        hashListId: { type: integer }
        status:
          type: string
          enum: [draft, running, paused, completed, cancelled]
        priority: { type: integer, minimum: 1, maximum: 10 }
        progress: { $ref: '#/components/schemas/CampaignProgress' }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignProgress:
      type: object
      description: |
        Cached progress payload written by `updateCampaignProgress`.
        Field names use camelCase to match the frontend hook
        consumers; the spec ticket's snake_case form is illustrative
        documentation, not a wire-format mandate.
      properties:
        totalTasks: { type: integer }
        completedTasks: { type: integer }
        tasksFailed:
          type: integer
          description: Tasks in terminal `failed` status.
        overallProgress:
          type: number
          description: Fraction in [0, 1] including in-flight task progress.
        eta:
          type: string
          format: date-time
          nullable: true
          description: |
            Forecasted completion based on average throughput since
            `startedAt`. Null when there's no throughput basis
            (no running tasks, no measurable progress, elapsed < 1s).
        hashProgress:
          type: object
          properties:
            total: { type: integer }
            cracked: { type: integer }
            remaining: { type: integer }
            percentage: { type: number }
        updatedAt: { type: string, format: date-time }

    AttackSummary:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        dependencies:
          type: array
          nullable: true
          items: { type: integer, description: Real attack ID }

    InlineAttack:
      type: object
      required: [mode]
      description: Used by the transactional POST /campaigns inline-create path.
      properties:
        mode: { type: integer, minimum: 0 }
        hashTypeId: { type: integer, minimum: 1 }
        wordlistId: { type: integer, minimum: 1 }
        rulelistId: { type: integer, minimum: 1 }
        masklistId: { type: integer, minimum: 1 }
        advancedConfiguration:
          type: object
          additionalProperties: true
        dependencyIndices:
          type: array
          items: { type: integer, minimum: 0 }
          description: |
            0-based indices into the same `attacks[]` array. NOT real
            attack IDs. The server translates these to real IDs after
            the insert returns.

    CreateCampaignRequest:
      type: object
      required: [name, hashListId]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000 }
        hashListId: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 1, maximum: 10 }
        attacks:
          type: array
          items: { $ref: '#/components/schemas/InlineAttack' }

    PatchCampaignRequest:
      type: object
      description: Partial-update; all fields optional.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000 }
        priority: { type: integer, minimum: 1, maximum: 10 }

    PutCampaignRequest:
      type: object
      required: [name, priority]
      description: |
        Full-replace; `name` and `priority` required. `description`
        may be `null` to explicitly clear.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 2000, nullable: true }
        priority: { type: integer, minimum: 1, maximum: 10 }

    CreateAttackRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: integer, minimum: 0 }
        hashTypeId: { type: integer, minimum: 1 }
        wordlistId: { type: integer, minimum: 1 }
        rulelistId: { type: integer, minimum: 1 }
        masklistId: { type: integer, minimum: 1 }
        advancedConfiguration:
          type: object
          additionalProperties: true
        dependencies:
          type: array
          items: { type: integer, minimum: 1 }
          description: Real attack IDs (not indices).

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              properties:
                code: { type: string, enum: [VALIDATION_ERROR] }

    DagInvalidError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              properties:
                code: { type: string, enum: [DAG_INVALID] }

    ResourceMissingError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              properties:
                code: { type: string, enum: [RESOURCE_MISSING] }

    StaleStateError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              properties:
                code: { type: string, enum: [STALE_STATE] }

    # ─── Resources ────────────────────────────────────────────────────
    HashType:
      type: object
      required: [id, name, hashcatMode, category]
      properties:
        id: { type: integer }
        name: { type: string }
        hashcatMode: { type: integer }
        category: { type: string }
        example: { type: string, nullable: true }

    HashList:
      type: object
      required: [id, projectId, name, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        hashTypeId: { type: integer, nullable: true }
        source: { type: string }
        status:
          type: string
          enum: [uploading, uploaded, processing, ready, error]
        fileRef:
          type: object
          nullable: true
          properties:
            bucket: { type: string }
            key: { type: string }
            name: { type: string }
            size: { type: integer }
            contentType: { type: string }
            uploadedAt: { type: string, format: date-time }
        statistics: { $ref: '#/components/schemas/HashListStatistics' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HashListStatistics:
      type: object
      description: |
        Persisted by the hash-list parser worker; the dashboard GET
        merges live counts on top before returning. Wire shape matches
        the shared Zod schema `hashListStatisticsSchema`.
      required: [totalCount, crackedCount, crackRate]
      properties:
        totalCount: { type: integer, minimum: 0 }
        crackedCount: { type: integer, minimum: 0 }
        crackRate: { type: number, minimum: 0, maximum: 1 }
        lastUpdated: { type: string, format: date-time }

    HashItem:
      type: object
      required: [id, hashListId, hashValue]
      properties:
        id: { type: integer }
        hashListId: { type: integer }
        hashValue: { type: string }
        plaintext: { type: string, nullable: true }
        crackedAt: { type: string, format: date-time, nullable: true }
        campaignId: { type: integer, nullable: true }
        attackId: { type: integer, nullable: true }
        taskId: { type: integer, nullable: true }
        agentId: { type: integer, nullable: true }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    ResourceListItem:
      type: object
      description: Generic shape for wordlists/rulelists/masklists rows.
      required: [id, projectId, name, status, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        name: { type: string }
        fileRef:
          type: object
          nullable: true
          properties:
            bucket: { type: string }
            key: { type: string }
            name: { type: string }
            size: { type: integer }
        lineCount: { type: integer, nullable: true }
        fileSize: { type: integer, nullable: true }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateHashListRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        hashTypeId: { type: integer, minimum: 1 }
        source: { type: string, maxLength: 50 }

    CreateResourceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    DetectHashTypeRequest:
      type: object
      required: [hashes]
      properties:
        hashes:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 1024 }

    HashCandidate:
      type: object
      required: [name, hashcatMode, category, confidence]
      properties:
        name: { type: string }
        hashcatMode: { type: integer }
        category: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }

    DetectHashTypeResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [hashValue, candidates]
            properties:
              hashValue: { type: string }
              candidates:
                type: array
                items: { $ref: '#/components/schemas/HashCandidate' }

    ResourceInUseError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            error:
              properties:
                code: { type: string, enum: [RESOURCE_IN_USE] }

  responses:
    # ─── Resources ────────────────────────────────────────────────────
    ResourceList:
      description: Generic resource list response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items: { $ref: '#/components/schemas/ResourceListItem' }
    ResourceCreated:
      description: Generic resource created.
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties:
              item: { $ref: '#/components/schemas/ResourceListItem' }
    ResourceItem:
      description: Generic resource item.
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties:
              item: { $ref: '#/components/schemas/ResourceListItem' }
    ResourceUploadResult:
      description: Generic resource upload result.
      content:
        application/json:
          schema:
            type: object
            required: [key, size]
            properties:
              key: { type: string }
              size: { type: integer }
    ResourceDownloadUrl:
      description: Presigned download URL.
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: { type: string, format: uri }
    PayloadTooLarge:
      description: Direct upload exceeds the 10 MB cap; use the chunked endpoint instead.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    properties:
                      code: { type: string, enum: [PAYLOAD_TOO_LARGE] }
    ValidationFailed:
      description: Request body or query parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CampaignWrapper:
      description: Returns the campaign envelope.
      content:
        application/json:
          schema:
            type: object
            required: [campaign]
            properties:
              campaign: { $ref: '#/components/schemas/Campaign' }

    ValidationError:
      description: Request body or path parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    ResourceNotFound:
      description: Campaign / attack not found or not visible in this project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotDraft:
      description: Operation only permitted on `draft` campaigns.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    properties:
                      code: { type: string, enum: [NOT_DRAFT] }

    InvalidTransition:
      description: |
        Requested transition is not allowed from the current status.
        See `VALID_TRANSITIONS` in `services/campaigns.ts` for the
        full allow-list.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    properties:
                      code: { type: string, enum: [INVALID_TRANSITION] }

    ServiceUnavailable:
      description: |
        Underlying service unavailable. `code` distinguishes the cause:
        - `SERVICE_UNAVAILABLE` — queue health check failed, or resource
          validation lookup itself threw.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    properties:
                      code: { type: string, enum: [SERVICE_UNAVAILABLE] }

    TaskGenerationFailed:
      description: Task generation failed during campaign start; campaign rolled back.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    properties:
                      code: { type: string, enum: [TASK_GENERATION_FAILED] }

security:
  - SessionCookie: []
