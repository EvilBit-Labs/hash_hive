openapi: 3.1.0
info:
  title: HashHive Agent API
  description: Token-authenticated REST API for Go-based hashcat agents
  version: 1.0.0

servers:
  - url: /api/v1/agent
    description: Agent API base path

paths:
  /sessions:
    post:
      operationId: createAgentSession
      summary: Authenticate agent and obtain session token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Agent auth token
                  example: "agent-secret-token-abc123"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                    description: JWT session token for subsequent requests
                  config:
                    type: object
                    properties:
                      agentId:
                        type: integer
                      projectId:
                        type: integer
        "401":
          $ref: "#/components/responses/AuthError"

  /heartbeat:
    post:
      operationId: sendHeartbeat
      summary: Send agent heartbeat with status and capabilities
      tags: [Monitoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Heartbeat"
      responses:
        "200":
          $ref: "#/components/responses/Acknowledged"
        "401":
          $ref: "#/components/responses/AuthError"

  /tasks/next:
    post:
      operationId: getNextTask
      summary: Request the next available task matching agent capabilities
      tags: [Tasks]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Next task or null if none available
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    oneOf:
                      - $ref: "#/components/schemas/TaskDescriptor"
                      - type: "null"
        "401":
          $ref: "#/components/responses/AuthError"

  /tasks/{taskId}/report:
    post:
      operationId: reportTaskProgress
      summary: Report task progress, results, and errors
      tags: [Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReport"
      responses:
        "200":
          $ref: "#/components/responses/Acknowledged"
        "401":
          $ref: "#/components/responses/AuthError"

  /tasks/{taskId}/zaps:
    get:
      operationId: getTaskZaps
      summary: Retrieve cracked hash values for a task
      description: >
        Returns hash values that have been cracked from the same hash list as the
        given task. Agents use this to build a "zap list" so they can skip
        already-cracked hashes during processing.
      tags: [Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: since
          in: query
          required: false
          description: Only return hashes cracked after this ISO-8601 datetime
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum number of zaps to return (1-10000, default 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 10000
      responses:
        "200":
          description: List of cracked hash values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZapResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "404":
          description: Task not found or not assigned to this agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /benchmark:
    post:
      operationId: submitBenchmarks
      summary: Submit hashcat benchmark results for this agent
      tags: [Monitoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkSubmission"
      responses:
        "200":
          $ref: "#/components/responses/Acknowledged"
        "401":
          $ref: "#/components/responses/AuthError"

  /errors:
    post:
      operationId: reportAgentError
      summary: Report an agent error
      tags: [Monitoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentError"
      responses:
        "200":
          $ref: "#/components/responses/Acknowledged"
        "401":
          $ref: "#/components/responses/AuthError"

  /cracker/check-update:
    post:
      operationId: checkCrackerUpdate
      summary: Poll for a newer cracker binary for this agent's engine + platform
      description: |
        Returns the latest active cracker binary the server knows about for
        the given `engine` + `platform` and a presigned download URL when
        the agent's `version` is older. Missing `engine` defaults to
        `'hashcat'` for back-compat with agents that have not adopted
        `capabilities.engines[]` yet.
      tags: [Cracker]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrackerCheckUpdateRequest"
      responses:
        "200":
          description: Update-check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrackerCheckUpdateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    Heartbeat:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [online, busy, error, benchmarked]
        capabilities:
          type: object
          properties:
            hashcatVersion:
              type: string
              description: |
                Legacy field — agents that have not adopted `engines[]` still
                advertise their hashcat version here. Consumers should treat
                this as a back-compat fallback for `engines[]`.
            engines:
              type: array
              description: |
                Cracker engines the agent runs and at what version. The
                forward-looking shape — replaces `hashcatVersion`. Multiple
                engines may be advertised when an agent runs more than one
                cracker (e.g., hashcat + john).
              items:
                $ref: '#/components/schemas/EngineDescriptor'
            gpuDevices:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  memory:
                    type: number
                  computeCapability:
                    type: string
        deviceInfo:
          type: object
          properties:
            cpuUsage:
              type: number
            memoryUsage:
              type: number
            temperature:
              type: number
        currentTask:
          type: object
          description: |
            Telemetry view of the task the agent is currently executing.
            Accepted so a fatal heartbeat can attribute the failure to a
            specific task, but `progress`, `speed`, and `temperature` are
            informational only — canonical task progress is reported via
            `POST /api/v1/agent/tasks/{id}/report` and is not written back
            to the `tasks` table from heartbeat handling.
          required: [taskId, progress, speed]
          properties:
            taskId:
              type: integer
              minimum: 1
            progress:
              type: number
              minimum: 0
            speed:
              type: number
            temperature:
              type: number
        error:
          type: object
          description: |
            Optional heartbeat-borne error. **Important contract**: the
            heartbeat `error` block and the standalone `POST /errors`
            endpoint are non-redundant channels — agents post a given
            error event via one channel OR the other, never both. The
            server has no idempotency key and cannot dedupe across
            channels, so double-posting produces duplicate `agent_errors`
            rows. A fatal-severity heartbeat error also forces the agent
            into `status='error'` and fails the agent's active tasks.
          required: [severity, message]
          properties:
            severity:
              type: string
              enum: [warning, fatal]
              description: |
                Narrower than `POST /errors`, which accepts
                `warning|error|fatal` for back-compat. Heartbeats classify
                strictly into warning (logged, task continues) or fatal
                (logged, task failed, agent status='error').

                **Recovery from status='error'**: an agent forced into
                `status='error'` by a prior fatal heartbeat can post a
                clean heartbeat (status='online' with no error block) to
                this endpoint to return to service — the agent token
                stays valid for `POST /heartbeat` regardless of status.
                Every other agent endpoint rejects the token while the
                agent is in `error` until a recovery heartbeat lands.
            message:
              type: string
              minLength: 1
              maxLength: 4096
            context:
              type: object
              additionalProperties: true
              description: |
                Free-form JSON context (stack trace, hashcat output,
                system metrics). Capped at 16 KiB characters when
                serialized — payloads larger than that are rejected with
                400. Do not include secrets (tokens, passwords) —
                operators with project access can read this field.

    EngineDescriptor:
      type: object
      required: [name, version]
      description: |
        Cracker engine descriptor. Engines that the registry knows about
        today are `hashcat` and `john` (lowercase). Agents may advertise
        other names; the server soft-fails (returns `updateAvailable:
        false`) for unknown engines rather than rejecting heartbeats.
      properties:
        name:
          type: string
          example: hashcat
        version:
          type: string
          example: "6.2.6"

    CrackerCheckUpdateRequest:
      type: object
      required: [version, platform]
      properties:
        engine:
          type: string
          description: |
            Cracker engine the agent runs. Defaults to `hashcat` when omitted.
            Stored values are always lowercase; the server normalizes the
            input.
          example: hashcat
        version:
          type: string
          description: The agent's currently-installed cracker version.
          example: "6.2.6"
        platform:
          type: string
          description: |
            Platform identifier matching the registry's stored binaries.
            Known values: `linux-x64`, `linux-arm64`, `windows-x64`,
            `darwin-x64`, `darwin-arm64`.
          example: linux-x64

    CrackerCheckUpdateResponse:
      oneOf:
        - type: object
          required: [updateAvailable, engine]
          description: No update available — the agent is on the latest active version.
          properties:
            updateAvailable:
              type: boolean
              enum: [false]
            engine:
              type: string
        - type: object
          required: [updateAvailable, engine, latestVersion, downloadUrl, expiresIn]
          description: Update available — agent should download the binary at `downloadUrl`.
          properties:
            updateAvailable:
              type: boolean
              enum: [true]
            engine:
              type: string
            latestVersion:
              type: string
              example: "6.2.7"
            downloadUrl:
              type: string
              format: uri
              description: Presigned MinIO download URL valid for `expiresIn` seconds.
            expiresIn:
              type: integer
              description: Lifetime of `downloadUrl` in seconds (currently 21600 — 6 hours).
              example: 21600

    TaskDescriptor:
      type: object
      required: [retryCount]
      properties:
        id:
          type: integer
        attackId:
          type: integer
        campaignId:
          type: integer
        mode:
          type: integer
          description: hashcat attack mode
        hashTypeId:
          type: integer
        retryCount:
          type: integer
          minimum: 0
          description: |
            Number of times this task has been retried after a previous
            assignment failed (e.g. agent timeout, error report, or stale
            reclaim). `0` for first-time assignments. Backed by the
            `tasks.retry_count` column, which is `NOT NULL DEFAULT 0`, so
            this property is always present on a task descriptor returned
            from `/tasks/next`.
        workRange:
          type: object
          properties:
            start:
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 9007199254740991
                - type: string
                  pattern: '^[0-9]+$'
                  maxLength: 64
              description: Keyspace start position. Non-negative integer in JS-safe range (max 2^53 - 1 = 9007199254740991); decimal-string when the value exceeds that (mask attacks with large keyspaces). Clients must accept either form and coerce to a bigint-equivalent before arithmetic; integer values above the safe-integer maximum are forbidden because precision would already be lost.
            end:
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 9007199254740991
                - type: string
                  pattern: '^[0-9]+$'
                  maxLength: 64
              description: Keyspace end position. Same number-or-string rule as start.
            total:
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 9007199254740991
                - type: string
                  pattern: '^[0-9]+$'
                  maxLength: 64
              description: Total keyspace units in this chunk (end - start). Same number-or-string rule as start.
            agentSpeedHs:
              type: integer
              minimum: 0
              description: Agent benchmark speed in hashes/second for the task's hash mode (fallback 1 MH/s if no benchmark)
        resources:
          type: object
          properties:
            hashListUrl:
              type: string
              format: uri
            wordlistUrl:
              type: string
              format: uri
            rulelistUrl:
              type: string
              format: uri
            masklistUrl:
              type: string
              format: uri

    TaskReport:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [running, completed, failed, exhausted]
        progress:
          type: object
          properties:
            keyspaceProgress:
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 9007199254740991
                - type: string
                  pattern: '^[0-9]+$'
                  maxLength: 64
              description: Absolute count of keyspace units already cracked within the task's `workRange.total`. Non-negative integer in JS-safe range (max 2^53 - 1 = 9007199254740991); decimal-string of digits only when the value exceeds that. Clients must NOT send integer values above the safe-integer maximum - precision is already lost by the time they cross the wire. Server divides by `workRange.total` to derive the [0, 1] fraction the campaign aggregate consumes.
            speed:
              type: number
            temperature:
              type: number
        results:
          type: array
          description: Batch of cracked hash results
          items:
            type: object
            required: [hashValue, plaintext]
            properties:
              hashValue:
                type: string
              plaintext:
                type: string
        errors:
          type: array
          items:
            type: string

    AgentError:
      type: object
      required: [severity, message]
      description: |
        Standalone error payload for `POST /api/v1/agent/errors`. Accepts
        the wider `warning|error|fatal` severity enum (for back-compat
        with agents that have not adopted the heartbeat-borne error
        block), but the same per-field size caps apply on both channels.
      properties:
        severity:
          type: string
          enum: [warning, error, fatal]
        message:
          type: string
          minLength: 1
          maxLength: 4096
        context:
          type: object
          additionalProperties: true
          description: |
            Capped at 16 KiB characters when serialized.
        taskId:
          type: integer
          minimum: 1

    ZapResponse:
      type: object
      required: [zaps, hasMore]
      properties:
        zaps:
          type: array
          description: Cracked hash values from the task's hash list
          items:
            type: string
        hasMore:
          type: boolean
          description: Whether more zaps are available beyond the requested limit

    BenchmarkSubmission:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [hashcatMode, hashType, speedHs, deviceName]
            properties:
              hashcatMode:
                type: integer
                minimum: 0
              hashType:
                type: string
                minLength: 1
              speedHs:
                type: integer
                minimum: 0
                description: Hashes per second
              deviceName:
                type: string
                minLength: 1
        crackerVersion:
          type: string
          minLength: 1
          description: Hashcat version string (e.g. "6.2.6")

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Acknowledged:
      description: Request acknowledged
      content:
        application/json:
          schema:
            type: object
            properties:
              acknowledged:
                type: boolean
                example: true

    AuthError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request body or query parameters failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
