name: Copilot Setup
'on':
  workflow_dispatch:
# Least-privilege default token scope: the setup steps only need to
# clone the repo. Any future step that needs to write back to the
# repo or post statuses must opt in explicitly with a job-level
# override.
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install

      - name: Display environment info
        run: just info
