name: Copilot Setup
"on":
  workflow_dispatch:
# Least-privilege default token scope: the setup steps only need to
# clone the repo. Any future step that needs to write back to the
# repo or post statuses must opt in explicitly with a job-level
# override.
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install

      - name: Display environment info
        run: just info
