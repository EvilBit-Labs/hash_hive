name: Copilot Setup
'on':
  workflow_dispatch:
# Least-privilege default token scope: the setup steps only need to
# clone the repo. Any future step that needs to write back to the
# repo or post statuses must opt in explicitly with a job-level
# override.
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install

      - name: Display environment info
        run: just info
