name: CI
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ci-check:
    runs-on: ubuntu-latest
    # Real-DB integration lane (`just test-db`) needs a live Postgres with the
    # TimescaleDB extension. The image is PostgreSQL 16 + TimescaleDB and, on a
    # fresh (always-empty in CI) data dir, auto-preloads `timescaledb`, so the
    # hypertable migration's `CREATE EXTENSION` succeeds without a command
    # override (which GitHub service containers do not support). The default
    # mocked lane (`just test`) does not use this service.
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: hashhive
          POSTGRES_PASSWORD: hashhive
          POSTGRES_DB: hashhive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hashhive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install
      # This job owns format/lint/type-check/build + unit/integration tests.
      # The `e2e-tests` job owns Playwright. `just ci-check` runs both locally
      # as the pre-push gate, but in CI they're split so e2e browser install
      # only happens where needed.
      - name: Quality gates and unit tests
        run: just check && just test

      # Real-DB lane: prepares hashhive_test (create + migrate) and runs
      # tests/db against the live TimescaleDB service. Verifies DB-layer
      # correctness the mocked lane cannot (LISTEN/NOTIFY, claim CTE, lease
      # reclaim, hypertable retention).
      - name: Real-DB integration tests
        run: just test-db
        env:
          DATABASE_URL: postgres://hashhive:hashhive@localhost:5432/hashhive_test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    # Pinned to a dated image, NOT ubuntu-latest: this job validates the
    # committed Playwright visual baseline (packages/frontend/e2e/*-snapshots),
    # whose pixels depend on the runner's system font stack (freetype,
    # fontconfig). ubuntu-latest is a rolling alias; an alias migration would
    # change the font stack and make the frozen baseline self-diff with no code
    # to blame. Keep this in lockstep with regenerate-visual-baselines.yml —
    # bump both together and regenerate the baseline when changing the image.
    # See docs/solutions/conventions/playwright-visual-baselines.md.
    runs-on: ubuntu-24.04
    needs: ci-check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install
      - run: just build

      # Use the project's pinned `@playwright/test` (frontend devDep) to
      # install browser binaries, NOT `bunx playwright install` — that
      # resolves to whatever Playwright version `bunx` happens to fetch,
      # which downloads a different `chromium_headless_shell-vN` than
      # what `@playwright/test@1.58.2` looks up at runtime, producing
      # `Executable doesn't exist` errors when versions skew.
      #
      # The install runs through the workspace's `test:e2e:install`
      # script so Playwright's CLI resolves to `node_modules/.bin/playwright`
      # in the frontend package — same Playwright the test runner uses.
      - name: Install Playwright browsers
        run: mise x -- bun --filter @hashhive/frontend test:e2e:install

      - name: Run E2E tests
        run: bun --filter @hashhive/frontend test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
