name: CI
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install
      - name: Run CI check
        run: just ci-check

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: ci-check
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: just install
      - run: just build

      # Use the project's pinned `@playwright/test` (frontend devDep) to
      # install browser binaries, NOT `bunx playwright install` — that
      # resolves to whatever Playwright version `bunx` happens to fetch,
      # which downloads a different `chromium_headless_shell-vN` than
      # what `@playwright/test@1.58.2` looks up at runtime, producing
      # `Executable doesn't exist` errors when versions skew.
      #
      # The install runs through the workspace's `test:e2e:install`
      # script so Playwright's CLI resolves to `node_modules/.bin/playwright`
      # in the frontend package — same Playwright the test runner uses.
      - name: Install Playwright browsers
        run: mise x -- bun --filter @hashhive/frontend test:e2e:install

      - name: Run E2E tests
        run: bun --filter @hashhive/frontend test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
